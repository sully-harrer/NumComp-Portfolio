<script>
"use strict";
/* ============ MATH ============ */
// Signal f(x) = 0.6 + 1.2 cos x + 0.8 sin 2x, sampled at x_l = 2πl/n, n = 8.
// DFT as in the note: f̂_k = Σ_l f_l e^{−2πikl/n}. Each term is an arrow of length f_l at angle −2πkl/n.
const N = 8, NG = 300;
const S = "₀₁₂₃₄₅₆₇₈₉";
const sig = x => 0.6 + 1.2 * Math.cos(x) + 0.8 * Math.sin(2 * x);
const XL = Array.from({ length: N }, (_, l) => 2 * Math.PI * l / N);
const FL = XL.map(sig);
const XG = Array.from({ length: NG }, (_, j) => 2 * Math.PI * j / (NG - 1));
const FG = XG.map(sig);
// head-to-tail partial sums z_0 = 0, z_{l+1} = z_l + f_l e^{−2πikl/n}
const CH = Array.from({ length: N }, (_, k) => {
  const z = [[0, 0]];
  for (let l = 0; l < N; l++) {
    const a = -2 * Math.PI * k * l / N, p = z[l];
    z.push([p[0] + FL[l] * Math.cos(a), p[1] + FL[l] * Math.sin(a)]);
  }
  return z;
});
const FH = CH.map(z => z[N]);                          // the coefficients f̂_k as [re, im]
const MAG = FH.map(([a, b]) => Math.hypot(a, b));
const MAXMAG = Math.max(...MAG);
// sanity: f̂ = [4.8, 4.8, −3.2i, 0, 0, 0, 3.2i, 4.8]
console.assert(Math.abs(FH[1][0] - 4.8) < 1e-9 && Math.abs(FH[2][1] + 3.2) < 1e-9 && MAG[3] < 1e-9, "unexpected DFT values");
// reconstruction with symmetric frequencies k = −3 … 4 (f̂_{−k} = f̂_{n−k})
const R0 = XG.map(() => FH[0][0] / N);
const R1 = XG.map((x, j) => R0[j] + 2 * (FH[1][0] * Math.cos(x) - FH[1][1] * Math.sin(x)) / N);
const R2 = XG.map((x, j) => R1[j] + 2 * (FH[2][0] * Math.cos(2 * x) - FH[2][1] * Math.sin(2 * x)) / N);
console.assert(R2.every((v, j) => Math.abs(v - FG[j]) < 1e-9), "reconstruction != f");
const ZERO = XG.map(() => 0);

const sYmin = -1.45, sYmax = 2.65;
let BB;   // bounding box of all arrow chains, for the complex-plane scale
{
  const pts = CH.flat();
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  BB = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
}

const lerpArr = (a, b, s) => a.map((v, k) => (1 - s) * v + s * b[k]);
const lerp = (a, b, s) => (1 - s) * a + s * b;
const clamp01 = x => Math.min(1, Math.max(0, x));
function fmt([a, b]) {
  const r = v => { const t = Math.round(v * 100) / 100; return Math.abs(t) < 1e-9 ? 0 : t; };
  const re = r(a), im = r(b), n = v => (v < 0 ? "−" : "") + Math.abs(v);
  if (!im) return n(re);
  const ims = (Math.abs(im) === 1 ? "" : Math.abs(im)) + "i";

  return n(re) + (im < 0 ? " − " : " + ") + ims;

/* ============ EASING ============ */

let st;
function freshState() {

    axes: 0, sig: { draw: 0, op: 0 }, samples: new Array(N).fill(0), ghost2pi: 0, pulse2pi: 0, sPulse: 0,
    overlay: { k: 0, op: 0 }, alias: 0,
    chain: { k: 0, prog: 0, op: 0 }, res: { k: 0, draw: 0, op: 0 },
    bars: new Array(N).fill(0), barHL: [],

    recon: { ys: null, op: 0 }

const scenes = [];
function add(name, dur, hold, update) { scenes.push({ name, dur, hold, update }); }

  if (k > 0 && e < 0.5) { st.chain = { k: k - 1, prog: N, op: 1 - 2 * e }; st.res = { k: k - 1, draw: 1, op: 1 - 2 * e }; return true; }
  st.res = { k, draw: 0, op: 0 }; return false;
}

add("Axes", 1.0, 0.2, e => { st.axes = e; });
add("A periodic signal f(x)", 1.6, 0.3, e => { st.sig.draw = e; st.sig.op = 1; });
add("n = 8 equally spaced samples fₗ at xₗ = 2πℓ/8", 1.6, 0.3, (e, u) => {
  st.samples = st.samples.map((_, l) => backOut(clamp01((u - l * 0.07) / 0.4)));
  st.ghost2pi = clamp01((u - 0.6) / 0.4);
});
add("x = 2π repeats x = 0, so it is not a new sample", 1.0, 0.6, (e, u) => { st.pulse2pi = Math.sin(Math.PI * u); });

const NOTE = [
  "k = 0: every arrow points the same way, so f̂₀ is just the sum of the samples",
  "k = 1 is in the signal: the arrows reinforce each other",
  "f̂₂ points straight down (it is imaginary): that frequency appears as a sine",
  "k = 3 is not in the signal: the arrows wind around and cancel to 0"

  add(`f̂${S[k]}: compare the samples with the wave of frequency ${k}`, 1.0, 0.2, e => {
    if (!fadePrev(k, e)) st.chain = { k, prog: 0, op: 1 };
    st.overlay = { k, op: e };
    st.cap = { parts: capFor(k), op: 1 };
    st.val.op = k > 0 ? Math.max(0, 1 - 2 * e) : 0;
    st.barHL = [];
  });
  add(k === 0 ? "Each sample fₗ becomes an arrow of length fₗ at angle −2πkℓ/8, laid head to tail"
              : `k = ${k}: each arrow turns another −2π·${k}/8 from the last`,
    k === 0 ? 3.0 : 2.2, 0.2, (e, u) => { st.chain = { k, prog: runProg(u), op: 1 }; });
  add(NOTE[k], 1.2, k === 3 ? 1.0 : 0.8, e => {
    st.chain = { k, prog: N, op: 1 }; st.res = { k, draw: e, op: 1 };
    st.bars[k] = e; st.barHL = [k];
    st.val = { text: `f̂${S[k]} = ${fmt(FH[k])}`, op: e };
  });
}
const FAST = ["", "", "", "", "k = 4: the fastest wave 8 samples can show", "k = 5", "k = 6", "k = 7"];
for (let k = 4; k < N; k++) {
  add(FAST[k], 1.5, 0.2, (e, u) => {
    st.overlay = { k, op: k === 4 ? 1 : 0 };
    st.cap = { parts: capFor(k), op: 1 };
    if (u < 0.25) { fadePrev(k, u / 0.5); st.val.op = 1 - u / 0.25; st.barHL = []; return; }
    st.chain = { k, prog: runProg(clamp01((u - 0.25) / 0.5)), op: 1 };
    const r = smooth(clamp01((u - 0.75) / 0.25));
    st.res = { k, draw: r, op: 1 }; st.bars[k] = r; st.barHL = r > 0 ? [k] : [];
    st.val = { text: `f̂${S[k]} = ${fmt(FH[k])}`, op: r };
  });
}
add("On 8 points, frequency 7 looks exactly like frequency −1: cos 7x and cos x agree at every sample", 2.0, 1.4, e => {
  st.chain = { k: 7, prog: N, op: 1 - e }; st.res = { k: 7, draw: 1, op: 1 - e };
  st.overlay = { k: 1, op: e }; st.alias = e; st.sig.op = 1 - 0.7 * e;
  st.cap = { parts: ["f̂", { sub: "7" }, " = conj(f̂", { sub: "1" }, ")"], op: 1 };
  st.val = { text: "so f̂₇ is really frequency −1", op: e };
  st.barHL = [1, 7];
});
add("Rebuild f from the coefficients, using frequencies k = −3 … 4", 1.2, 0.3, e => {
  st.overlay.op = 1 - e; st.alias = 1 - e; st.sig.op = 0.3 - 0.05 * e;
  st.cap = { parts: ["f(x) = ⅛ Σ f̂", { sub: "k" }, " e", { sup: "ikx" }], op: 1 };
  st.val = { text: "k = −3, …, 4", op: e }; st.barHL = [];
});
add("f̂₀ / 8 = 0.6 is the average level", 1.2, 0.3, e => {
  st.recon = { ys: lerpArr(ZERO, R0, e), op: e }; st.barHL = [0];
  st.val = { text: "0.6", op: 1 };
});
add("f̂₁ and f̂₇ (frequencies ±1) together add 1.2 cos x", 1.4, 0.3, e => {
  st.recon = { ys: lerpArr(R0, R1, e), op: 1 }; st.barHL = [1, 7];
  st.val.text = "0.6 + 1.2 cos x";
});
add("f̂₂ and f̂₆ (frequencies ±2) together add 0.8 sin 2x", 1.4, 0.3, e => {
  st.recon = { ys: lerpArr(R1, R2, e), op: 1 }; st.barHL = [2, 6];
  st.val.text = "0.6 + 1.2 cos x + 0.8 sin 2x";
});
add("f̂₃, f̂₄ and f̂₅ are zero, so nothing is left to add", 0.8, 0.3, () => { st.recon = { ys: R2, op: 1 }; st.barHL = [3, 4, 5]; });
add("The sum passes through all 8 samples: interpolation with waves", 1.6, 1.6, (e, u) => {
  st.recon = { ys: R2, op: 1 }; st.barHL = []; st.sPulse = Math.sin(Math.PI * u);
});

let TOTAL = 0;
scenes.forEach(s => { s.start = TOTAL; TOTAL += s.dur + s.hold; s.end = TOTAL; });

let T = 0;
function sceneIndex(t) { let k = 0; scenes.forEach((s, i) => { if (t >= s.start) k = i; }); return k; }

function render() {
  st = freshState();
  for (const s of scenes) {
    if (T < s.start) break;
    const u = clamp01((T - s.start) / s.dur);
    s.update(smooth(u), u);
  }
  draw();
  updateUI();
}

/* ============ LAYOUT ============ */
const NS = "http://www.w3.org/2000/svg";
let W = 800, H = 440, FS = 16, P = {};
function panels() {
  const g = 10;
  if (W / H >= 1.3) {
    const lw = Math.round(W * 0.58);
    P.sig = { x: g, y: g, w: lw - g, h: Math.round(H * 0.6) - g };
    P.spec = { x: g, y: P.sig.y + P.sig.h + g, w: lw - g, h: H - (P.sig.y + P.sig.h + g) - g };
    P.plane = { x: lw + g, y: g, w: W - lw - 2 * g, h: H - 2 * g };
  } else {
    P.sig = { x: g, y: g, w: W - 2 * g, h: Math.round(H * 0.5) - g };
    const by = P.sig.y + P.sig.h + g, bh = H - by - g, sw = Math.round((W - 3 * g) * 0.48);

  const s = P.sig; P.si = { x: s.x + 34, y: s.y + 26, w: s.w - 44, h: s.h - 48 };
  const b = P.spec; P.bi = { x: b.x + 14, y: b.y + 26, w: b.w - 28, h: b.h - 48 };

  const aw = p.w - 2 * pad, ah = p.h - top - pad;

}
const sx = x => P.si.x + x / (2 * Math.PI) * P.si.w;
const sy = v => P.si.y + P.si.h - (v - sYmin) / (sYmax - sYmin) * P.si.h;
const px = a => P.pl.ox + P.pl.sc * a;
const py = b => P.pl.oy - P.pl.sc * b;
const bx = k => P.bi.x + (k + 0.5) * P.bi.w / N;
const by = m => P.bi.y + P.bi.h - m / MAXMAG * P.bi.h;

/* ============ RENDERING ============ */
const svg = document.getElementById("svg");
function el(tag, attrs, parent) {

    if (p.hat) {

      const r = el("tspan", { dy: (0.34 * size).toFixed(1) }, t);
      r.textContent = "\u200b";

const pathD = (xs, ys) => { let d = ""; for (let j = 0; j < xs.length; j++) d += (j ? "L" : "M") + sx(xs[j]).toFixed(1) + " " + sy(ys[j]).toFixed(1); return d; };

const tickTxt = (parent, x, y, s, anchor) => { el("text", { x, y, "text-anchor": anchor || "middle", class: "tick" }, parent).textContent = s; };

const R = {};

  const pl = P.plane, top = pl.y + FS * 2 + 26;
  el("line", { x1: pl.x + 8, x2: pl.x + pl.w - 8, y1: py(0), y2: py(0), stroke: "var(--axis)", "stroke-width": 1.2 }, R.axes);
  el("line", { x1: px(0), x2: px(0), y1: top, y2: pl.y + pl.h - 8, stroke: "var(--axis)", "stroke-width": 1.2 }, R.axes);
  tickTxt(R.axes, pl.x + pl.w - 10, py(0) - 6, "Re", "end");
  tickTxt(R.axes, px(0) + 6, top + 10, "Im", "start");

  // signal content
  const clip = el("clipPath", { id: "sigclip" }, el("defs", {}));
  el("rect", { x: P.sig.x, y: P.sig.y, width: P.sig.w, height: P.sig.h }, clip);
  const sg = el("g", { "clip-path": "url(#sigclip)" });
  R.overlay = el("path", { class: "curve", stroke: "var(--c2)", "stroke-width": 2, "stroke-dasharray": "7 5" }, sg);
  R.alias = el("path", { class: "curve", stroke: "var(--c3)", "stroke-width": 2 }, sg);
  R.sig = el("path", { class: "curve", stroke: "var(--p)", pathLength: 1 }, sg);
  R.recon = el("path", { class: "curve", stroke: "var(--sum)" }, sg);
  R.stems = XL.map(() => el("line", { stroke: "var(--c0)", "stroke-width": 1.5, "stroke-dasharray": "3 4" }, sg));
  R.dots = XL.map(() => el("circle", { fill: "var(--pointfill)", stroke: "var(--c0)", "stroke-width": 2.5 }, sg));
  R.ghost = el("circle", { cx: sx(2 * Math.PI), cy: sy(FL[0]), fill: "none", stroke: "var(--ghost)", "stroke-width": 2, "stroke-dasharray": "3 3" }, sg);

  // spectrum content
  const bw = Math.max(6, P.bi.w / N * 0.55);
  R.bars = FH.map(() => el("rect", { width: bw, rx: 2 }));
  R.bw = bw;

  // plane content
  R.arrows = XL.map(() => makeArrow(svg, "var(--c0)", 2.5));
  R.res = makeArrow(svg, "var(--p)", 4);
  R.resDot = el("circle", { r: 3.5, fill: "var(--text)", cx: px(0), cy: py(0) });
  R.cap = el("text", { x: pl.x + 12, y: pl.y + FS + 8, "font-size": FS });
  R.val = el("text", { x: pl.x + 12, y: pl.y + 2 * FS + 14, "font-size": FS - 1 });
  R.val.style.fill = "var(--p)";
}

function draw() {
  R.axes.setAttribute("opacity", st.axes);
  R.resDot.setAttribute("opacity", st.axes);

  // signal panel
  setDraw(R.sig, pathD(XG, FG), st.sig.draw, st.sig.op);
  const k = st.overlay.k;
  R.overlay.setAttribute("d", pathD(XG, XG.map(x => Math.cos(k * x))));
  R.overlay.setAttribute("opacity", st.overlay.op * 0.9);
  R.alias.setAttribute("d", pathD(XG, XG.map(x => Math.cos(7 * x))));
  R.alias.setAttribute("opacity", st.alias * 0.85);
  if (st.recon.ys) { R.recon.setAttribute("d", pathD(XG, st.recon.ys)); R.recon.setAttribute("opacity", st.recon.op); }
  else R.recon.setAttribute("opacity", 0);

  const p = st.chain.prog, running = st.chain.op > 0 && p > 0 && p < N;
  const cur = running ? Math.min(N - 1, Math.floor(p)) : -1;
  XL.forEach((x, l) => {
    const s = st.samples[l], hot = l === cur;
    const r = s * (hot ? 9 : 6) * (1 + 0.4 * st.sPulse);
    R.dots[l].setAttribute("cx", sx(x)); R.dots[l].setAttribute("cy", sy(FL[l])); R.dots[l].setAttribute("r", r);
    R.dots[l].setAttribute("stroke", hot ? "var(--p)" : "var(--c0)");
    const t = R.stems[l];
    t.setAttribute("x1", sx(x)); t.setAttribute("x2", sx(x)); t.setAttribute("y1", sy(0)); t.setAttribute("y2", sy(FL[l]));
    t.setAttribute("opacity", 0.6 * Math.min(1, s));
  });
  R.ghost.setAttribute("r", 6 * st.ghost2pi * (1 + 0.6 * st.pulse2pi));
  R.ghost.setAttribute("opacity", st.ghost2pi);

  // spectrum
  FH.forEach((_, j) => {
    const h = by(0) - by(MAG[j] * st.bars[j]);
    const b = R.bars[j];
    b.setAttribute("x", bx(j) - R.bw / 2); b.setAttribute("y", by(0) - h); b.setAttribute("height", Math.max(0, h));
    b.setAttribute("fill", st.barHL.includes(j) ? "var(--p)" : "var(--c0)");
    b.setAttribute("opacity", st.bars[j] > 0 ? 1 : 0);
  });

  // complex plane: arrow chain
  const z = CH[st.chain.k];
  R.arrows.forEach((o, l) => {
    const f = clamp01(p - l);
    if (f <= 0 || st.chain.op <= 0) { o.g.setAttribute("opacity", 0); return; }
    const [a0, b0] = z[l], [a1, b1] = z[l + 1];
    setArrow(o, px(a0), py(b0), px(lerp(a0, a1, f)), py(lerp(b0, b1, f)),
      st.chain.op * (l === cur ? 1 : 0.75) * Math.min(1, f * 3), 10);
  });
  const zr = CH[st.res.k][N];
  if (st.res.op > 0 && st.res.draw > 0) setArrow(R.res, px(0), py(0), px(zr[0] * st.res.draw), py(zr[1] * st.res.draw), st.res.op, 13);
  else R.res.g.setAttribute("opacity", 0);

  setLabel(R.cap, st.cap.parts, FS); R.cap.setAttribute("opacity", st.cap.op);
  setLabel(R.val, st.val.text, FS - 1);
  R.val.setAttribute("opacity", st.val.op);
}

/* ============ PLAYER + CONTROLS ============ */
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PLAY_ICON = '<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>', PAUSE_ICON = '<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';
let playing = false, raf = 0, lastNow = 0, userPaused = false, scrubbing = false;

function tick(now) {
  if (!playing) return;
  T = Math.min(TOTAL, T + Math.min(0.1, (now - lastNow) / 1000)); lastNow = now;
  if (T >= TOTAL) playing = false;
  render();
  if (playing) raf = requestAnimationFrame(tick);
}
function play() {
  if (T >= TOTAL - 1e-6) T = 0;
  playing = true; userPaused = false; lastNow = performance.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); updateUI();
}
function pause() { playing = false; cancelAnimationFrame(raf); updateUI(); }
function seek(t) { T = Math.min(TOTAL, Math.max(0, t)); render(); }
function stepScene(dir) {
  const i = sceneIndex(T), s = scenes[i];
  if (reduced) {
    if (dir > 0) seek(T < s.end - 1e-6 ? s.end : (scenes[i + 1] || s).end);
    else seek(i > 0 ? scenes[i - 1].end : 0);
    return;
  }
  if (dir > 0) seek(i + 1 < scenes.length ? scenes[i + 1].start : TOTAL);
  else seek(T - s.start > 0.4 || i === 0 ? s.start : scenes[i - 1].start);
}
function togglePlay() { if (playing) { userPaused = true; pause(); } else play(); }

function updateUI() {
  $("play").innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
  $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
  if (!scrubbing) $("seek").value = Math.round(T / TOTAL * 1000);
  $("scene").textContent = (!playing && T <= scenes[0].end + 1e-6) ? "Press play to begin" : scenes[sceneIndex(T)].name;
}

$("play").onclick = togglePlay;
$("prev").onclick = () => stepScene(-1);
$("next").onclick = () => stepScene(1);
$("replay").onclick = () => { seek(0); play(); };
const seekEl = $("seek");
seekEl.addEventListener("pointerdown", () => { scrubbing = true; seekEl._was = playing; pause(); });
seekEl.addEventListener("input", () => { seek(seekEl.value / 1000 * TOTAL); });
const endScrub = () => { if (!scrubbing) return; scrubbing = false; if (seekEl._was && T < TOTAL) play(); };
seekEl.addEventListener("pointerup", endScrub); seekEl.addEventListener("pointercancel", endScrub);

document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (e.code === "Space" && tag !== "BUTTON" && tag !== "INPUT") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight" && tag !== "INPUT") { e.preventDefault(); stepScene(1); }
  else if (e.code === "ArrowLeft" && tag !== "INPUT") { e.preventDefault(); stepScene(-1); }
});

let autoPaused = false;
new IntersectionObserver(entries => {
  const vis = entries[entries.length - 1].isIntersecting;
  if (vis) { if (autoPaused && !userPaused && T < TOTAL) play(); autoPaused = false; }
  else if (playing) { autoPaused = true; pause(); }
}, { threshold: 0.5 }).observe(document.body);

/* ============ THEMING ============ */
const PARENT_HTML = (() => { try { return window.parent.document.documentElement; } catch (e) { return null; } })();
const applyTheme = t => document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
const queryTheme = new URLSearchParams(location.search).get("theme");
const parentTheme = () => PARENT_HTML && window.parent !== window ? PARENT_HTML.getAttribute("saved-theme") : null;
applyTheme(queryTheme || parentTheme() || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
if (!queryTheme && PARENT_HTML && window.parent !== window) {
  const sync = () => applyTheme(parentTheme());
  const mo = new MutationObserver(sync); mo.observe(PARENT_HTML, { attributes: true, attributeFilter: ["saved-theme"] });
  const onChange = e => applyTheme(e.detail && e.detail.theme);
  window.parent.document.addEventListener("themechange", onChange);
  addEventListener("pagehide", () => { mo.disconnect(); window.parent.document.removeEventListener("themechange", onChange); });
} else if (!queryTheme) {
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => applyTheme(e.matches ? "light" : "dark"));
}

/* ============ INIT ============ */
function layout() {
  const r = $("stage").getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return false;
  const w = Math.round(Math.min(900, Math.max(340, r.width))), h = Math.round(w * r.height / r.width);
  if (w === W && h === H && R.axes) return false;
  W = w; H = Math.max(300, h); FS = W < 560 ? 13 : 16;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  panels();
  return true;
}
layout(); panels(); build();
T = scenes[0].end;
render();
new ResizeObserver(() => { if (layout()) { build(); render(); } }).observe($("stage"));
</script>
</body>
</html>
