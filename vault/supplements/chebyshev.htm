<script>
"use strict";
/* ============ MATH ============ */
// Horizontal positions are stored as h in [0, 1]. In part 1, h tracks the angle θ in [−π, 0];
// in part 2, h tracks x = cos θ in [−1, 1]. Morphing between them is just lerping h.
const N = 3, NG = 300, ND = 9;
const S = "₀₁₂₃₄₅₆₇₈₉";
const TH = Array.from({ length: NG }, (_, k) => -Math.PI + Math.PI * k / (NG - 1));
const thN = TH.map(t => (t + Math.PI) / Math.PI);          // h when the axis is θ
const xN = TH.map(t => (Math.cos(t) + 1) / 2);             // h when the axis is x = cos θ
const WAVE = TH.map(t => Math.cos(N * t));                 // heights never change during the morph
const DTH = Array.from({ length: ND }, (_, k) => -Math.PI + Math.PI * k / (ND - 1));
const DthN = DTH.map(t => (t + Math.PI) / Math.PI), DxN = DTH.map(t => (Math.cos(t) + 1) / 2);
const DY = DTH.map(t => Math.cos(N * t));

const XS = Array.from({ length: NG }, (_, k) => -1 + 2 * k / (NG - 1));
const XH = XS.map(x => (x + 1) / 2);
const TN = [XS.map(() => 1), XS.slice()];                  // T0 = 1, T1 = x
for (let n = 1; n < 4; n++) TN.push(XS.map((x, k) => 2 * x * TN[n][k] - TN[n - 1][k]));
const TWOX = TN.map(t => t.map((v, k) => 2 * XS[k] * v));
console.assert(TN.every((t, n) => t.every((v, k) => Math.abs(v - Math.cos(n * Math.acos(XS[k]))) < 1e-9)), "recurrence != cos(n arccos x)");
const POLY = ["1", "x", "2x² − 1", "4x³ − 3x", "8x⁴ − 8x² + 1"];
const yMin = -2.3, yMax = 2.3, H0 = -0.03, H1 = 1.03;

const lerpArr = (a, b, s) => a.map((v, k) => (1 - s) * v + s * b[k]);
const lerp = (a, b, s) => (1 - s) * a + s * b;
const clamp01 = x => Math.min(1, Math.max(0, x));

/* ============ EASING ============ */
function smooth(t) {
  const sig = x => 1 / (1 + Math.exp(-x)), err = sig(-5);
  return clamp01((sig(10 * (t - 0.5)) - err) / (1 - 2 * err));
}
function backOut(t) { const c1 = 1.7, c3 = c1 + 1; return t <= 0 ? 0 : Math.max(0, 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2)); }

/* ============ SCENE STATE + TIMELINE ============ */
// render() rebuilds `st` from scratch by replaying every started scene, so scrubbing is exact.
let st;
function freshState() {
  return {
    axes: 0, hMix: 0, wave: { draw: 0, op: 0 }, dots: new Array(ND).fill(0), dotPulse: 0,
    band: 0, cap: { a: "", b: "", mix: 0, op: 0 }, ghost: 0, pulse: 0,
    T: TN.map(() => ({ draw: 0, op: 1 })), work: { ys: null, op: 0, c: 0 }, legend: TN.map(() => 0)
  };
}
const scenes = [];
function add(name, dur, hold, update) { scenes.push({ name, dur, hold, update }); }

// Part 1: T3 is just a cosine wave in θ, viewed with x = cos θ on the horizontal axis.
add("Axes: the angle θ runs from −π to 0", 1.2, 0.2, e => { st.axes = e; });
add("A plain cosine wave: cos(3θ)", 1.8, 0.4, e => {
  st.wave.draw = e; st.wave.op = 1;
  st.cap = { a: "y = cos(3θ)", b: "", mix: 0, op: clamp01((e - 0.5) / 0.5) };
});
add("Mark equally spaced angles θₖ", 1.4, 0.4, (e, u) => {
  st.dots = st.dots.map((_, k) => backOut(clamp01((u - k * 0.07) / 0.4)));
});
add("Substitute x = cos θ: every point slides sideways", 2.6, 0.6, e => {
  st.hMix = e; st.cap.b = "y = T₃(x)"; st.cap.mix = e;
});
add("Heights are unchanged; the points now bunch up near ±1", 1.2, 0.6, (e, u) => {
  st.dotPulse = Math.sin(Math.PI * u);
});
add("Because it is a cosine, T₃ stays between −1 and 1", 1.0, 0.6, e => { st.band = e; });
add("T₃(x) = cos(3 arccos x) = 4x³ − 3x", 1.0, 0.8, e => {
  st.dots = st.dots.map(d => d * (1 - e));
  st.cap = { a: "y = T₃(x)", b: "T₃(x) = cos(3 arccos x) = 4x³ − 3x", mix: e, op: 1 };
});
add("Set T₃ aside and build the family from the recurrence", 1.0, 0.3, e => {
  st.wave.op = 1 - e; st.ghost = 0.55 * e; st.band = 1 - e; st.cap.op = 1 - e;
});

// Part 2: the recurrence T(n+1) = 2x·T(n) − T(n−1).
add("Start with T₀ = 1 and T₁ = x", 1.4, 0.4, e => {
  st.T[0].draw = e; st.T[1].draw = e; st.legend[0] = e; st.legend[1] = e;
  st.cap = { a: "", b: "T₀(x) = 1,   T₁(x) = x", mix: 1, op: e };
});
for (let n = 1; n <= 3; n++) {
  add(`Multiply T${S[n]} by 2x`, 1.4, 0.3, e => {
    st.work = { ys: lerpArr(TN[n], TWOX[n], e), op: 1, c: n + 1 };
    st.cap = { a: "", b: `2x · T${S[n]}(x)`, mix: 1, op: 1 };
  });
  add(`Subtract T${S[n - 1]}`, 1.4, 0.3, e => {
    st.work = { ys: lerpArr(TWOX[n], TN[n + 1], e), op: 1, c: n + 1 };
    st.cap.b = `T${S[n + 1]}(x) = 2x · T${S[n]}(x) − T${S[n - 1]}(x)`;
  });
  add(n === 2 ? "T₃ lands exactly on the cos(3θ) curve from before" : `T${S[n + 1]}(x) = ${POLY[n + 1]}`,
    n === 2 ? 1.8 : 0.8, 0.4, (e, u) => {
      st.work.op = 0; st.T[n + 1].draw = 1; st.legend[n + 1] = 1;
      st.T[n - 1].op = 1 - 0.7 * e;
      st.cap.b = `T${S[n + 1]}(x) = ${POLY[n + 1]}`;
      if (n === 2) { st.pulse = Math.sin(Math.PI * clamp01(u / 0.6)); st.ghost = 0.55 * (1 - clamp01((u - 0.6) / 0.4)); }
    });
}
add("Each Tₙ has degree n, yet all of them stay within [−1, 1]", 1.6, 1.4, e => {
  st.T.forEach(t => { t.op = lerp(t.op, 1, e); });
  st.band = e; st.cap.b = "Tₙ₊₁(x) = 2x · Tₙ(x) − Tₙ₋₁(x)";
});

let TOTAL = 0;
scenes.forEach(s => { s.start = TOTAL; TOTAL += s.dur + s.hold; s.end = TOTAL; });

let T = 0;
function sceneIndex(t) { let k = 0; scenes.forEach((s, i) => { if (t >= s.start) k = i; }); return k; }

function render() {
  st = freshState();
  for (const s of scenes) {
    if (T < s.start) break;
    const u = clamp01((T - s.start) / s.dur);
    s.update(smooth(u), u);
  }
  draw();
  updateUI();
}

/* ============ RENDERING ============ */
const NS = "http://www.w3.org/2000/svg";
const M = { l: 44, r: 22, t: 16, b: 36 };
let W = 800, H = 440, FS = 20;
const sx = h => M.l + (h - H0) / (H1 - H0) * (W - M.l - M.r);
const sy = v => H - M.b - (v - yMin) / (yMax - yMin) * (H - M.t - M.b);
const svg = document.getElementById("svg");
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
function pathD(hs, ys) { let d = ""; for (let k = 0; k < hs.length; k++) d += (k ? "L" : "M") + sx(hs[k]).toFixed(1) + " " + sy(ys[k]).toFixed(1); return d; }
function setDraw(path, d, draw, op) {
  path.setAttribute("d", d);
  path.setAttribute("stroke-dasharray", draw >= 0.999 ? "none" : "1 2");
  path.setAttribute("stroke-dashoffset", 1 - draw);
  path.setAttribute("opacity", draw <= 0.001 ? 0 : op);
}
function setText(t, s) { if (t._s !== s) { t.textContent = s; t._s = s; } }
const COL = i => `var(--c${i})`;

const R = {};
let TD = [];
function build() {
  svg.innerHTML = "";
  const defs = el("defs", {});
  el("rect", { x: M.l, y: 0, width: W - M.l - M.r + 4, height: H - M.b + 6 }, el("clipPath", { id: "plotclip" }, defs));

  // axes, grid, ticks
  R.axes = el("g", {});
  [-2, -1, 1, 2].forEach(v => el("line", { x1: sx(H0), x2: sx(H1), y1: sy(v), y2: sy(v), stroke: "var(--grid)", "stroke-width": 1 }, R.axes));
  [0, 0.5, 1].forEach(h => el("line", { x1: sx(h), x2: sx(h), y1: sy(yMax), y2: sy(yMin), stroke: "var(--grid)", "stroke-width": 1 }, R.axes));
  el("line", { x1: sx(H0), x2: sx(H1), y1: sy(0), y2: sy(0), stroke: "var(--axis)", "stroke-width": 1.5, "stroke-linecap": "round" }, R.axes);
  el("line", { x1: sx(H0), x2: sx(H0), y1: sy(yMax), y2: sy(yMin), stroke: "var(--axis)", "stroke-width": 1.5, "stroke-linecap": "round" }, R.axes);
  [-2, -1, 0, 1, 2].forEach(v => { el("text", { x: sx(H0) - 8, y: sy(v) + 5, "text-anchor": "end", class: "tick" }, R.axes).textContent = v < 0 ? "−" + (-v) : v; });
  const yb = sy(yMin) + 20;
  R.thTicks = el("g", {});
  [["−π", 0], ["−π/2", 0.5], ["0", 1]].forEach(([s, h]) => { el("text", { x: sx(h), y: yb, "text-anchor": "middle", class: "tick" }, R.thTicks).textContent = s; });
  el("text", { x: sx(H1), y: yb, "text-anchor": "end", "font-size": FS }, R.thTicks).textContent = "θ";
  R.xTicks = el("g", {});
  [["−1", 0], ["0", 0.5], ["1", 1]].forEach(([s, h]) => { el("text", { x: sx(h), y: yb, "text-anchor": "middle", class: "tick" }, R.xTicks).textContent = s; });
  el("text", { x: sx(H1), y: yb, "text-anchor": "end", "font-size": FS }, R.xTicks).textContent = "x";

  // the [−1, 1] band
  R.band = el("g", {});
  el("rect", { x: sx(0), y: sy(1), width: sx(1) - sx(0), height: sy(-1) - sy(1), fill: "var(--p)", "fill-opacity": 0.08 }, R.band);
  [1, -1].forEach(v => el("line", { x1: sx(0), x2: sx(1), y1: sy(v), y2: sy(v), stroke: "var(--p)", "stroke-width": 1.5, "stroke-dasharray": "5 5" }, R.band));

  const clip = el("g", { "clip-path": "url(#plotclip)" });
  R.ghost = el("path", { class: "curve", stroke: "var(--ghost)", "stroke-dasharray": "6 6", d: pathD(XH, TN[3]) }, clip);
  TD = TN.map(t => pathD(XH, t));
  R.T = TN.map((_, i) => el("path", { class: "curve", stroke: COL(i), pathLength: 1 }, clip));
  R.work = el("path", { class: "curve", pathLength: 1 }, clip);
  R.wave = el("path", { class: "curve", stroke: "var(--p)", pathLength: 1 }, clip);
  R.drops = DTH.map(() => el("line", { stroke: "var(--dot)", "stroke-width": 1.5, "stroke-dasharray": "3 4" }, clip));
  R.axisDots = DTH.map(() => el("circle", { fill: "var(--dot)" }, clip));
  R.curveDots = DTH.map(() => el("circle", { fill: "var(--dot)", stroke: "var(--bg)", "stroke-width": 1.5 }, clip));

  // caption (two layers for crossfades) and legend, centered at the top where curves don't reach
  const cx = sx(0.5);
  R.capA = el("text", { x: cx, y: M.t + 22, "text-anchor": "middle", "font-size": FS });
  R.capB = el("text", { x: cx, y: M.t + 22, "text-anchor": "middle", "font-size": FS });
  const step = FS < 20 ? 44 : 52, lx0 = cx - step * TN.length / 2;
  R.legend = TN.map((_, i) => {
    const g = el("g", {}), x = lx0 + i * step, y = M.t + 50;
    el("line", { x1: x, x2: x + 16, y1: y - 5, y2: y - 5, stroke: COL(i), "stroke-width": 3.5, "stroke-linecap": "round" }, g);
    el("text", { x: x + 21, y, "font-size": FS - 3 }, g).textContent = "T" + S[i];
    return g;
  });
}

function draw() {
  R.axes.setAttribute("opacity", st.axes);
  R.thTicks.setAttribute("opacity", st.axes * (1 - st.hMix));
  R.xTicks.setAttribute("opacity", st.axes * st.hMix);
  R.band.setAttribute("opacity", st.band);

  setDraw(R.wave, pathD(lerpArr(thN, xN, st.hMix), WAVE), st.wave.draw, st.wave.op);
  DTH.forEach((_, k) => {
    const x = sx(lerp(DthN[k], DxN[k], st.hMix)), s = st.dots[k];
    const r = s * (1 + 0.45 * st.dotPulse);
    R.curveDots[k].setAttribute("cx", x); R.curveDots[k].setAttribute("cy", sy(DY[k])); R.curveDots[k].setAttribute("r", 6 * r);
    R.axisDots[k].setAttribute("cx", x); R.axisDots[k].setAttribute("cy", sy(0)); R.axisDots[k].setAttribute("r", 4.5 * r);
    const l = R.drops[k];
    l.setAttribute("x1", x); l.setAttribute("x2", x); l.setAttribute("y1", sy(0)); l.setAttribute("y2", sy(DY[k]));
    l.setAttribute("opacity", 0.7 * Math.min(1, s));
  });

  R.ghost.setAttribute("opacity", st.ghost * (1 + 0.8 * st.pulse));
  R.ghost.setAttribute("stroke-width", 2 + 3 * st.pulse);

  st.T.forEach((t, i) => setDraw(R.T[i], TD[i], t.draw, t.op));
  if (st.work.ys && st.work.op > 0) {
    R.work.setAttribute("stroke", COL(st.work.c));
    setDraw(R.work, pathD(XH, st.work.ys), 1, st.work.op);
  } else R.work.setAttribute("opacity", 0);
  R.legend.forEach((g, i) => g.setAttribute("opacity", st.legend[i] * Math.max(0.35, st.T[i].op)));

  setText(R.capA, st.cap.a); setText(R.capB, st.cap.b);
  R.capA.setAttribute("opacity", st.cap.op * (1 - clamp01(st.cap.mix * 2)));
  R.capB.setAttribute("opacity", st.cap.op * clamp01(st.cap.mix * 2 - 1 + (st.cap.a ? 0 : 1)));
}

/* ============ PLAYER + CONTROLS ============ */
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PLAY_ICON = '<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>', PAUSE_ICON = '<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';
let playing = false, raf = 0, lastNow = 0, userPaused = false, scrubbing = false;

function tick(now) {
  if (!playing) return;
  T = Math.min(TOTAL, T + Math.min(0.1, (now - lastNow) / 1000)); lastNow = now;
  if (T >= TOTAL) playing = false;
  render();
  if (playing) raf = requestAnimationFrame(tick);
}
function play() {
  if (T >= TOTAL - 1e-6) T = 0;
  playing = true; userPaused = false; lastNow = performance.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); updateUI();
}
function pause() { playing = false; cancelAnimationFrame(raf); updateUI(); }
function seek(t) { T = Math.min(TOTAL, Math.max(0, t)); render(); }
function stepScene(dir) {
  const i = sceneIndex(T), s = scenes[i];
  if (reduced) {
    if (dir > 0) seek(T < s.end - 1e-6 ? s.end : (scenes[i + 1] || s).end);
    else seek(i > 0 ? scenes[i - 1].end : 0);
    return;
  }
  if (dir > 0) seek(i + 1 < scenes.length ? scenes[i + 1].start : TOTAL);
  else seek(T - s.start > 0.4 || i === 0 ? s.start : scenes[i - 1].start);
}
function togglePlay() { if (playing) { userPaused = true; pause(); } else play(); }

function updateUI() {
  $("play").innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
  $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
  if (!scrubbing) $("seek").value = Math.round(T / TOTAL * 1000);
  $("scene").textContent = (!playing && T <= scenes[0].end + 1e-6) ? "Press play to begin" : scenes[sceneIndex(T)].name;
}

$("play").onclick = togglePlay;
$("prev").onclick = () => stepScene(-1);
$("next").onclick = () => stepScene(1);
$("replay").onclick = () => { seek(0); play(); };
const seekEl = $("seek");
seekEl.addEventListener("pointerdown", () => { scrubbing = true; seekEl._was = playing; pause(); });
seekEl.addEventListener("input", () => { seek(seekEl.value / 1000 * TOTAL); });
const endScrub = () => { if (!scrubbing) return; scrubbing = false; if (seekEl._was && T < TOTAL) play(); };
seekEl.addEventListener("pointerup", endScrub); seekEl.addEventListener("pointercancel", endScrub);

document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (e.code === "Space" && tag !== "BUTTON" && tag !== "INPUT") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight" && tag !== "INPUT") { e.preventDefault(); stepScene(1); }
  else if (e.code === "ArrowLeft" && tag !== "INPUT") { e.preventDefault(); stepScene(-1); }
});

let autoPaused = false;
new IntersectionObserver(entries => {
  const vis = entries[entries.length - 1].isIntersecting;
  if (vis) { if (autoPaused && !userPaused && T < TOTAL) play(); autoPaused = false; }
  else if (playing) { autoPaused = true; pause(); }
}, { threshold: 0.5 }).observe(document.body);

/* ============ THEMING ============ */
const PARENT_HTML = (() => { try { return window.parent.document.documentElement; } catch (e) { return null; } })();
const applyTheme = t => document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
const queryTheme = new URLSearchParams(location.search).get("theme");
const parentTheme = () => PARENT_HTML && window.parent !== window ? PARENT_HTML.getAttribute("saved-theme") : null;
applyTheme(queryTheme || parentTheme() || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
if (!queryTheme && PARENT_HTML && window.parent !== window) {
  const sync = () => applyTheme(parentTheme());
  const mo = new MutationObserver(sync); mo.observe(PARENT_HTML, { attributes: true, attributeFilter: ["saved-theme"] });
  const onChange = e => applyTheme(e.detail && e.detail.theme);
  window.parent.document.addEventListener("themechange", onChange);
  addEventListener("pagehide", () => { mo.disconnect(); window.parent.document.removeEventListener("themechange", onChange); });
} else if (!queryTheme) {
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => applyTheme(e.matches ? "light" : "dark"));
}
